name = "每日 AI 资讯日内采集归档"
prompt = "每天 09:00、12:00、15:00、18:00（Asia/Shanghai）执行当前项目的 AI 资讯日内采集归档流程。工作区：/Volumes/UGREEN SSD/WorkSpace/zixun。\n\n严格读取并遵循 /Volumes/UGREEN SSD/WorkSpace/zixun/AI资讯日内采集工作流.yml。\n\n邮件执行记录（必须先建立，再开始业务步骤）：\n- 每轮开始用 .venv-web/bin/python 生成新的 UUID run_id 和带 +08:00 时区的 started_at；建立仅本机保存的 .task_reports/<run_id>.json 记录。不要读取或输出 .env 的凭据，邮件脚本自行读取。\n- 以下步骤的“停止”“失败”“无候选”只停止后续业务操作，仍必须执行末尾的邮件收尾。执行过程中记录本轮数据源异常和各步骤实际结果，成功清理候选前先保留来源状态供摘要使用。\n\n\n核心边界：\n- 本任务采集、Agent 过滤清理并追加本地当日归档，成功后同步归档到 GitHub 并核验 Render 自动部署；绝不写飞书知识库、绝不推送飞书群聊、绝不调用 publish_ai_news.py 或 run_ai_news.py --legacy-auto。\n- 不读取飞书历史；get_news_list.py 必须带 --no-history。\n- 失败在任务结果和本轮邮件摘要中汇报，不得发送飞书告警。\n\n执行：\n1. 进入工作目录，运行 python3 -m py_compile run_ai_news.py get_news_list.py archive_ai_news.py。\n2. 运行 python3 get_news_list.py --no-history --workflow AI资讯日内采集工作流.yml --output tmp_ai_news_collect_candidates.json --pretty，触发所有配置数据源，获取最近 24 小时完整候选。\n3. 若脚本失败、候选明显不足或重要来源异常，使用浏览器直接打开原始资讯源/频道页补充最近 24 小时候选；不要使用 websearch/web search。保留原始标题、发布时间、来源、详情页 URL。\n4. Agent 读取完整候选和已有 ai_news_daily/当天日期.json（若存在），保留所有有存档价值的 AI/大模型/智能体/机器人/算力/核心技术/头部公司及相关政策资讯；不限制 TopK。剔除非 AI、广告、导航/登录壳、缺字段、低价值、重复事件和非详情页链接。\n5. 写 tmp_ai_news_filtered.json，包含 date、selection_reason、source_status、items；items 保留资讯标题、发布时间、来源、超链接、可用的 desc/rss_content/content_source/member_only，并增加 agent_reason。\n6. 运行 python3 archive_ai_news.py --input tmp_ai_news_filtered.json --archive-dir ai_news_daily --result ai_news_collect_result.json --cleanup tmp_ai_news_collect_candidates.json。脚本会幂等合并、原子写入并在成功后清理临时文件。\n7. 读取 ai_news_collect_result.json，只汇报 ok、date、archive_file、input_count、added_count、updated_count、skipped_duplicate_count、archive_count、cleanup_removed。不得泄露任何密钥、token、Authorization header 或完整 webhook。\n8. 归档成功并完成结果读取、临时文件清理后，将本轮归档同步到 GitHub，使公网问答服务取得最新资讯：\n   - 检查当前分支为 main、origin 为 https://github.com/zhangzgen/zixun.git；否则停止同步并单独汇报，保留本地归档。\n   - 检查工作区及已有暂存内容。只将本轮新增或更新的 ai_news_daily/*.json、ai_news_collect_result.json 按明确路径暂存；保留其他代码、运行结果、工作流及用户改动，不顺带提交，不使用无差别 git add。\n   - 排除 .env、密钥、token、完整 webhook、.DS_Store、缓存、临时文件和含凭据的内容。已有无关暂存内容时不要混入提交或清除用户暂存内容，停止并汇报。\n   - 有上述归档变更时创建提交，说明为 Sync AI news archive YYYY-MM-DD HH:mm（Asia/Shanghai）；无变更则跳过提交。执行 git push origin main，不强制推送、不重置、不覆盖或丢弃本地修改。认证失败或远端分叉时保留现场并单独汇报。\n9. 推送成功后核验 Render 自动部署：\n   - 使用 gh api 查看 zhangzgen/zixun 的 deployments 及对应 statuses，只检查本次推送的提交 SHA，目标 environment_url 为 https://zixun-archive.onrender.com。不要把其他提交的部署成功当成本次成功。\n   - 可在最多 5 分钟内间隔检查；尚无部署记录、仍在构建或超时只汇报部署未确认/进行中，不断言成功，不手动触发额外部署。\n   - 确认部署 success 后检查 https://zixun-archive.onrender.com/api/health 正常响应；失败时单独汇报 Render 部署状态和可公开的日志链接。\n   - 在原有采集结果后补充 GitHub 同步状态、提交 SHA、Render 部署状态。本任务始终不调用任何飞书 API，不发送飞书消息或告警。\n\n统一邮件收尾（每次任务都执行，成功、部分完成、失败、无候选跳过均适用）：\n- 在业务操作及既有 GitHub/Render 步骤结束后，用 .venv-web/bin/python 写入本轮 .task_reports/<run_id>.json：run_id、task（本任务名）、status（success/partial/failed/skipped）、started_at、finished_at（ISO 8601，带 +08:00）、summary（简明中文执行摘要）、counts（本轮实际数量）、source_status（来源状态的简明文字）、feishu（发布结果、文档链接；采集任务填“不适用”）、github（实际同步状态、分支、提交 SHA）、render（本次 SHA 的部署状态/可公开日志链接；未核验则明确“未核验”）、errors（异常文字数组）。\n- 只采用本轮确实执行的结果；旧的 ai_news_*_result.json 不能作为本轮成功证据。未运行的字段标为未执行，无法确认的字段标为未核验，数量未知则不填，禁止编造数量、部署成功或错误恢复。\n- status 按整个任务判断：主流程失败为 failed，主流程完成但存在来源/同步/部署异常为 partial，无候选而未发布为 skipped，主流程及已要求的同步/核验均完成为 success；部署仍在构建或未确认须在摘要明确说明。\n- 运行 .venv-web/bin/python task_email.py --report .task_reports/<run_id>.json，默认通过 smtp.qq.com:465 SSL 发给 SMTP_TO（未配置则 SMTP_USER），发送者和授权码从本机 .env 的 SMTP_USER、SMTP_PASSWORD 读取。\n- 每轮只发送一封最终执行摘要。已发送的同一 run_id 会由脚本跳过，不能换 run_id 重发。邮件失败保留报告并在任务最终结果中汇报 email=failed/error_type/smtp_code，不用飞书替代、不重新执行业务、不自动重复发送。\n- 邮件和报告不得包含密钥、授权码、tenant_access_token、Authorization header、完整 webhook 或原始未脱敏日志；只写脱敏摘要。不得将 .env、.task_reports/、邮件地址或授权码提交 GitHub。脚本 accepted_by_smtp 只表示 SMTP 已接收，最终结果补充 email 状态。"
