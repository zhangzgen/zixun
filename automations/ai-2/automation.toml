prompt = "每天 09:00、12:00、15:00、18:00（Asia/Shanghai）执行当前项目的 AI 资讯日内采集归档流程。工作区：/Volumes/UGREEN SSD/WorkSpace/zixun。\n\n严格读取并遵循 /Volumes/UGREEN SSD/WorkSpace/zixun/AI资讯日内采集工作流.yml。\n\n核心边界：\n- 本任务采集、Agent 过滤清理并追加本地当日归档，成功后同步归档到 GitHub 并核验 Render 自动部署；绝不写飞书知识库、绝不推送飞书群聊、绝不调用 publish_ai_news.py 或 run_ai_news.py --legacy-auto。\n- 不读取飞书历史；get_news_list.py 必须带 --no-history。\n- 失败只在任务结果中汇报，不得发送飞书告警。\n\n执行：\n1. 进入工作目录，运行 python3 -m py_compile run_ai_news.py get_news_list.py archive_ai_news.py。\n2. 运行 python3 get_news_list.py --no-history --workflow AI资讯日内采集工作流.yml --output tmp_ai_news_collect_candidates.json --pretty，触发所有配置数据源，获取最近 24 小时完整候选。\n3. 若脚本失败、候选明显不足或重要来源异常，使用浏览器直接打开原始资讯源/频道页补充最近 24 小时候选；不要使用 websearch/web search。保留原始标题、发布时间、来源、详情页 URL。\n4. Agent 读取完整候选和已有 ai_news_daily/当天日期.json（若存在），保留所有有存档价值的 AI/大模型/智能体/机器人/算力/核心技术/头部公司及相关政策资讯；不限制 TopK。剔除非 AI、广告、导航/登录壳、缺字段、低价值、重复事件和非详情页链接。\n5. 写 tmp_ai_news_filtered.json，包含 date、selection_reason、source_status、items；items 保留资讯标题、发布时间、来源、超链接、可用的 desc/rss_content/content_source/member_only，并增加 agent_reason。\n6. 运行 python3 archive_ai_news.py --input tmp_ai_news_filtered.json --archive-dir ai_news_daily --result ai_news_collect_result.json --cleanup tmp_ai_news_collect_candidates.json。脚本会幂等合并、原子写入并在成功后清理临时文件。\n7. 读取 ai_news_collect_result.json，只汇报 ok、date、archive_file、input_count、added_count、updated_count、skipped_duplicate_count、archive_count、cleanup_removed。不得泄露任何密钥、token、Authorization header 或完整 webhook。\n8. 归档成功并完成结果读取、临时文件清理后，将本轮归档同步到 GitHub，使公网问答服务取得最新资讯：\n   - 检查当前分支为 main、origin 为 https://github.com/zhangzgen/zixun.git；否则停止同步并单独汇报，保留本地归档。\n   - 检查工作区及已有暂存内容。只将本轮新增或更新的 ai_news_daily/*.json、ai_news_collect_result.json 按明确路径暂存；保留其他代码、运行结果、工作流及用户改动，不顺带提交，不使用无差别 git add。\n   - 排除 .env、密钥、token、完整 webhook、.DS_Store、缓存、临时文件和含凭据的内容。已有无关暂存内容时不要混入提交或清除用户暂存内容，停止并汇报。\n   - 有上述归档变更时创建提交，说明为 Sync AI news archive YYYY-MM-DD HH:mm（Asia/Shanghai）；无变更则跳过提交。执行 git push origin main，不强制推送、不重置、不覆盖或丢弃本地修改。认证失败或远端分叉时保留现场并单独汇报。\n9. 推送成功后核验 Render 自动部署：\n   - 使用 gh api 查看 zhangzgen/zixun 的 deployments 及对应 statuses，只检查本次推送的提交 SHA，目标 environment_url 为 https://zixun-archive.onrender.com。不要把其他提交的部署成功当成本次成功。\n   - 可在最多 5 分钟内间隔检查；尚无部署记录、仍在构建或超时只汇报部署未确认/进行中，不断言成功，不手动触发额外部署。\n   - 确认部署 success 后检查 https://zixun-archive.onrender.com/api/health 正常响应；失败时单独汇报 Render 部署状态和可公开的日志链接。\n   - 在原有采集结果后补充 GitHub 同步状态、提交 SHA、Render 部署状态。本任务始终不调用任何飞书 API，不发送飞书消息或告警。"
