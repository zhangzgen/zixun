version = 1
id = "ai"
kind = "cron"
name = "每日 AI 资讯飞书推送"
prompt = "每天早上 08:30（Asia/Shanghai）执行当前项目的 AI 资讯每日发布流程。当前工作区：/Volumes/UGREEN SSD/WorkSpace/zixun。\n\n严格读取并遵循 /Volumes/UGREEN SSD/WorkSpace/zixun/AI咨询收集工作流.yml。\n\n邮件执行记录（必须先建立，再开始业务步骤）：\n- 每轮开始用 .venv-web/bin/python 生成新的 UUID run_id 和带 +08:00 时区的 started_at；建立仅本机保存的 .task_reports/<run_id>.json 记录。不要读取或输出 .env 的凭据，邮件脚本自行读取。\n- 以下步骤的“停止”“失败”“无候选”只停止后续业务操作，仍必须执行末尾的邮件收尾。执行过程中记录本轮数据源异常和各步骤实际结果，成功清理候选前先保留来源状态供摘要使用。\n\n\n核心边界：\n- 本任务不再现场抓取任何资讯源，不运行 get_news_list.py，不修改 ai_news_daily 日归档。\n- 候选只来自 ai_news_daily 中今天和昨天的归档文件。\n- 只有 publish_ai_news.py 可以写飞书知识库和推送群聊。\n\n执行：\n1. 进入工作目录，运行 .venv-web/bin/python -m py_compile run_ai_news.py archive_ai_news.py prepare_ai_news_publish.py get_news_details.py publish_ai_news.py。\n2. 运行 .venv-web/bin/python prepare_ai_news_publish.py --archive-dir ai_news_daily --output tmp_ai_news_candidates.json。该脚本读取今天和昨天的日归档，并读取飞书中今天、昨天和前天已发布要闻作为 history_text。\n3. 若两个归档都不存在或合并后无候选，停止并汇报 archive_status，不得回退到全数据源现场采集，也不得发布空消息。\n4. Agent 读取 candidates、archive_status、history_text、history_status，自行做语义过滤和 TopK：\n   - 默认 TopK=20，有效资讯不足则宁缺毋滥；\n   - 发布优先级严格分为三层：第一层是智能体 / Agent 生态，包括 Agent、Agentic AI、多智能体、Agent harness、Agent OS、Agent 框架与协议，以及工具调用、记忆、规划、评测、安全和运行环境等相关知识；第二层是基础大模型、模型能力与核心模型技术；第三层是机器人、算力、AI 应用、头部公司动态及相关政策监管等其他 AI 内容；\n   - 先选择达到价值门槛的第一层 Agent 相关资讯，再用第二层大模型资讯补足，最后才选择第三层其他 AI 资讯；不得让一般大模型或泛 AI 动态挤占高价值 Agent 资讯的位置；\n   - 低价值、营销软文或仅因标题含 Agent 关键词的内容仍应剔除；\n   - 候选内部去重，并与飞书 history_text 中已发布资讯做语义去重；\n   - 保留原始标题、发布时间、来源和资讯详情页 URL，不得使用搜索页、频道页、首页或榜单页。\n5. 写 tmp_ai_news_selected.json，包含 topk、selection_reason、selected_items；每条保留 id、资讯标题、发布时间、来源、超链接、agent_reason。\n6. 运行 .venv-web/bin/python get_news_details.py --input tmp_ai_news_selected.json --candidates tmp_ai_news_candidates.json --output tmp_ai_news_details.json。\n7. 正文抓取失败、过短、疑似反爬或登录导航壳时，优先通过浏览器打开原始详情页获取正文；不要使用 websearch/web search。脚本与浏览器都无法可靠确认时才丢弃。\n8. Agent 生成 tmp_ai_news_publish.json：date、items；每条包含 id、原始标题/发布时间/来源/详情页超链接、一句尽量 60 字以内的中文资讯简介（核心 1-2 个实体用 Markdown 加粗）、1 个关键词、可选群聊摘要。为最重要的 3-5 条提供群聊摘要；存在高价值 Agent 相关资讯时，群聊摘要优先覆盖这些资讯。\n9. 运行 .venv-web/bin/python publish_ai_news.py --input tmp_ai_news_publish.json --result ai_news_run_result.json --cleanup-temp。Wiki 关键词链接必须是 **[关键词](详情页URL)** 单层方括号格式。\n10. 成功后读取 ai_news_run_result.json，只汇报 ok、date、doc_title、doc_url、published_count、chat_count、push_result、cleanup_removed。失败时保留临时文件；若脚本已发送“资讯警告”，不要重复发送。不得泄露 App Secret、tenant_access_token、Authorization header 或完整 webhook。\n11. 将最新代码仓库推送到 GitHub（仅在飞书发布成功并完成上述结果读取与清理后执行）：\n   - 在当前工作目录检查 git status、当前分支和 origin；目标须为 https://github.com/zhangzgen/zixun.git 的 main 分支，不符合时停止同步并汇报。\n   - 检查工作区差异及已有暂存内容，将应纳入仓库的最新代码、工作流、定时任务配置、资讯归档及运行结果按明确路径暂存；不要使用无差别 git add，排除 .DS_Store、__pycache__、临时文件、凭据和含密钥或 token 的内容。\n   - 有待提交变更时创建提交，说明为 Sync AI news repository YYYY-MM-DD（日期按 Asia/Shanghai）；无变更则跳过提交。\n   - 执行 git push origin main，包含此前尚未推送的提交；不得强制推送、重置、自动覆盖或丢弃本地改动。\n   - 若认证失败、远端存在分叉或推送失败，保留本地提交及工作区并单独汇报 GitHub 同步错误；不得重新发布飞书或重复发送资讯告警。同步成功时单独汇报 GitHub 同步状态、分支和提交号。\n\n统一邮件收尾（每次任务都执行，成功、部分完成、失败、无候选跳过均适用）：\n- 在业务操作及既有 GitHub/Render 步骤结束后，用 .venv-web/bin/python 写入本轮 .task_reports/<run_id>.json：run_id、task（本任务名）、status（success/partial/failed/skipped）、started_at、finished_at（ISO 8601，带 +08:00）、summary（简明中文执行摘要）、counts（本轮实际数量）、source_status（来源状态的简明文字）、feishu（发布结果、文档链接；采集任务填“不适用”）、github（实际同步状态、分支、提交 SHA）、render（本次 SHA 的部署状态/可公开日志链接；未核验则明确“未核验”）、errors（异常文字数组）。\n- 只采用本轮确实执行的结果；旧的 ai_news_*_result.json 不能作为本轮成功证据。未运行的字段标为未执行，无法确认的字段标为未核验，数量未知则不填，禁止编造数量、部署成功或错误恢复。\n- status 按整个任务判断：主流程失败为 failed，主流程完成但存在来源/同步/部署异常为 partial，无候选而未发布为 skipped，主流程及已要求的同步/核验均完成为 success；部署仍在构建或未确认须在摘要明确说明。\n- 运行 .venv-web/bin/python task_email.py --report .task_reports/<run_id>.json，默认通过 smtp.qq.com:465 SSL 发给 SMTP_TO（未配置则 SMTP_USER），发送者和授权码从本机 .env 的 SMTP_USER、SMTP_PASSWORD 读取。\n- 每轮只发送一封最终执行摘要。已发送的同一 run_id 会由脚本跳过，不能换 run_id 重发。邮件失败保留报告并在任务最终结果中汇报 email=failed/error_type/smtp_code，不用飞书替代、不重新执行业务、不自动重复发送。\n- 邮件和报告不得包含密钥、授权码、tenant_access_token、Authorization header、完整 webhook 或原始未脱敏日志；只写脱敏摘要。不得将 .env、.task_reports/、邮件地址或授权码提交 GitHub。脚本 accepted_by_smtp 只表示 SMTP 已接收，最终结果补充 email 状态。\n\n技术报告展示与运行环境：\n- 全部业务命令使用 .venv-web/bin/python；发布前确认可以导入 mistune，避免系统 python3 缺少依赖。\n- 知识库日报保留最新15份已全文阅读报告：正文来源标签及原标题，换行概述，只有来源链接原文，完整总结默认折叠，隐藏日期和收录统计，最新优先。\n- 群聊卡片采用AI资讯同样的编号短句和绿色标签样式，在同级技术报告栏目只显示最新5份已读报告，chat_overview不超过60个字符，标签为厂商名；不显示日期、完整总结或折叠面板，底部More打开完整日报。继续使用原有发送收据，不重新发送已成功推送的历史卡片。"
