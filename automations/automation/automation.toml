name = "技术报告每日采集与飞书归档"
prompt = "每天北京时间00:00（前一天24:00）在 /Volumes/UGREEN SSD/WorkSpace/zixun 读取并执行 技术报告每日采集工作流.yml，全程使用 .venv-web/bin/python。\n\n任何采集和归档操作之前，先运行 .venv-web/bin/python -m technical_reports.task_report begin，保存返回的run_id和report路径。这会建立本轮开始时间及技术报告归档快照，仅保存在本机.task_reports/。必须每轮使用新run_id，不能拿旧结果充当本轮证据。\n\n覆盖 Anthropic、OpenAI、DeepSeek、Kimi、GLM、Google、Seed 的官方索引与分页，采集新报告及修订版本。依次执行 collect、reader、ingest、sync；按工作流核对候选身份、精确首发日期、报告范围和主报告原文，处理日期、范围、原文刷新与覆盖诊断。Agent必须完整阅读全部原文和附录后生成中文概述、金字塔总结和不超过60个字符的chat_overview，并保存JSON、原文证据和阅读断点。原文失败通过正常浏览器或官方全文替代入口补齐，不能用摘要冒充全文、误取引用PDF或伪造阅读证据；无法完整读取的报告保留待处理状态，不能进入每日已读列表。\n\n同步指定飞书总目录、七个厂商汇总及报告子文档，更新当天已有每日要闻中的同级技术报告栏。总目录、厂商汇总和日报使用正文来源标签及原标题，换行显示概述，只有来源链接原文，完整总结默认折叠，隐藏日期、收录统计和独立总结标题，按发布时间倒序排列。日报固定显示最新15份已读报告；单份子页面沿用既有版式。每日AI资讯群卡片显示最新5份技术报告的编号短句及绿色厂商标签，长度与AI资讯相近，共用More打开完整日报。技术报告夜间任务不额外群发。\n\n将本轮technical_report_daily总结JSON按明确路径同步GitHub，严格遵循工作流，不混入用户改动，不提交本地凭据、完整archive.json、原文或阅读缓存，并按本次提交SHA核验Render公网检索更新。业务、来源、飞书、GitHub或Render异常如实记录；失败只停止后续业务操作，仍须完成邮件收尾。\n\n每轮邮件收尾（成功、部分完成、失败和无更新均适用）：在本轮report中填写真实status（success/partial/failed/skipped）、summary、source_status、feishu、github、render和errors，未知数量不填，未执行或未核验的步骤明确说明，不用旧结果冒充成功。然后运行 .venv-web/bin/python -m technical_reports.task_report finish --report .task_reports/<run_id>.json，对比采集前后归档，自动按厂商列出新增、原文修订、补齐全文阅读及总结更新的报告标题、原文/飞书链接与阅读状态，并生成本轮变化数量。无归档变化也明确说明，来源覆盖失败仍单独汇报。快照缺失、归档损坏或无法核对时，记录厂商变更未核验，不编造历史变化或无更新，仍发送本轮失败或部分完成摘要。\n\n最后运行 .venv-web/bin/python task_email.py --report .task_reports/<run_id>.json，使用现有SMTP_TO（未配置则SMTP_USER）和既有邮件通道。配置由脚本自行读取，不输出凭据。每轮仅发一封最终邮件，同run_id已发送则跳过；邮件失败保留报告并汇报email错误，不換run_id重发、不重跑业务、不用飞书代发。不得把.env、.task_reports/、邮件地址、密钥、token、Authorization header、完整webhook或未脱敏日志提交GitHub或写入邮件。\n\n最终汇报新增、修订、已读、待处理、飞书同步、邮件状态、GitHub/Render和覆盖缺口。应用内仅在有新增、修订、失败或需处理时通知，无变化保持安静；这不影响每轮邮件发送。"
