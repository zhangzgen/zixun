prompt = "每天北京时间00:00（前一天24:00）在 /Volumes/UGREEN SSD/WorkSpace/zixun 读取并执行 技术报告每日采集工作流.yml，全程使用 .venv-web/bin/python。\n\n开始本轮业务前，检查.task_reports/中本任务已结束且email.status为failed的历史报告；先用原report路径运行 .venv-web/bin/python -m technical_reports.task_report finalize --report 原report路径 补发邮件。保留原run_id、结束时间和归档变化，不重跑历史业务，不为补发新建run_id。历史邮件仍失败也记录异常并继续建立本轮报告。\n\n任何采集和归档操作之前，先运行 .venv-web/bin/python -m technical_reports.task_report begin，保存返回的run_id和report路径。这会建立本轮开始时间及技术报告归档快照，仅保存在本机.task_reports/。必须每轮使用新run_id，不能拿旧结果充当本轮证据。begin返回status为failed时停止业务，使用已保存的本轮report直接进入邮件收尾。\n\n覆盖 Anthropic、OpenAI、DeepSeek、Kimi、GLM、Google、Seed 的官方索引、RSS与分页，只检查是否有新发布且未归档的技术报告。collect使用默认new_only模式，禁止使用--recheck-archived。获取全文前按报告身份和官方网址与归档去重；已归档报告（包括历史待处理项、同一论文的新版本）直接跳过，不重新下载、不刷新主链接、不检测修订、不重新阅读、不启动历史补齐。先运行collect并检查items和new_date_verified_candidates。若均为空，立即跳过reader、ingest、sync、GitHub和Render，记录本轮检查结果后只执行邮件收尾；来源失败或新候选未核实如实报告，不能宣称确认无新增。只有出现新报告才核对其身份、首发日期、范围和主报告原文，并执行reader、ingest、sync。历史日期与范围未决清单继续保留，不因历史缺口执行长时间浏览器巡检或全文补救。Agent必须完整阅读全部原文和附录后生成中文概述、金字塔总结和不超过60个字符的chat_overview，并保存JSON、原文证据和阅读断点。原文失败通过正常浏览器或官方全文替代入口补齐，不能用摘要冒充全文、误取引用PDF或伪造阅读证据；无法完整读取的报告保留待处理状态，不能进入每日已读列表。\n\n总结时必须严格遵守以下规则。规则适用于中文概述、金字塔总结和chat_overview。\n1. 句子要短，每句尽量不超过30个字。\n2. 一句只讲一件事。\n3. 同一个概念从头到尾用同一个词，不要换说法。\n4. 用主动语态，每句的主词要清楚。\n5. 不要堆叠名词，一个名词短语最多三个词。\n生成后逐句检查上述五条规则。发现不符合的句子，先改写再保存和发布。\n\n仅在本轮有新报告归档时同步指定飞书总目录、七个厂商汇总及报告子文档，更新当天已有每日要闻中的同级技术报告栏。总目录、厂商汇总和日报使用正文来源标签及原标题，换行显示概述，只有来源链接原文，完整总结默认折叠，隐藏日期、收录统计和独立总结标题，按发布时间倒序排列。日报固定显示最新15份已读报告；单份子页面沿用既有版式。每日AI资讯群卡片显示最新5份技术报告的编号短句及绿色厂商标签，长度与AI资讯相近，共用More打开完整日报。技术报告夜间任务不额外群发。\n\n仅在本轮新报告产生总结JSON变化时，将本轮technical_report_daily总结JSON按明确路径同步GitHub，严格遵循工作流，不混入用户改动，不提交本地凭据、完整archive.json、原文或阅读缓存，并按本次提交SHA核验Render公网检索更新。业务、来源、飞书、GitHub或Render异常如实记录；失败只停止后续业务操作，仍须完成邮件收尾。\n\n每轮邮件收尾是必做步骤，成功、部分完成、失败、无更新及业务提前停止都适用。先在本轮report中填写真实status（success/partial/failed/skipped）、summary、source_status、feishu、github、render和errors；未知数量不填，未执行或未核验的步骤明确说明。source_status可用文字、对象或厂商列表，厂商列表无需framework字段，不用旧结果冒充本轮成功。\n\n必须运行统一入口 .venv-web/bin/python -m technical_reports.task_report finalize --report .task_reports/<run_id>.json，完成归档变化核验和邮件发送后才输出最终回复。不要把finish和发邮件拆成可遗漏的两步。统一入口自动按厂商列出新增、原文修订、补齐全文阅读及总结更新的报告标题、原文/飞书链接与阅读状态。快照缺失、归档损坏或无法核对时记录“厂商变更未核验”，移除未核实增量数量，仍发送失败或部分完成邮件；未填写最终业务状态时自动形成失败汇报。\n\n邮件使用现有SMTP_TO（未配置则SMTP_USER）和既有SMTP通道，配置由脚本读取，不输出凭据。发送失败最多尝试3次，每次间隔5秒；只重试同一run_id的邮件，保留最终业务报告、结束时间及归档变化，不重跑采集、阅读、归档、飞书、GitHub或Render。成功回执防止重复发送。只发一封指成功后去重，不是失败后禁止重试。\n\n检查返回ok=true且email为accepted_by_smtp或already_sent，才可汇报邮件步骤成功；只尝试发送不算成功，SMTP接受不等于确认进入收件箱。三次均失败时保留report及email失败状态，应用内明确汇报；下一轮开始前补发同一报告，不换run_id。业务异常或应用内无变化保持安静均不能跳过邮件收尾。不得把.env、.task_reports/、邮件地址、密钥、token、Authorization header、完整webhook或未脱敏日志提交GitHub或写入邮件。\n\n最终汇报新增、已读、待处理、飞书同步、邮件状态、GitHub/Render和覆盖缺口。应用内仅在有新增、失败或需处理时通知，无变化保持安静；这不影响每轮邮件发送。"
